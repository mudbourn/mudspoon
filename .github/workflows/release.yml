name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v0.1.2. Created from the chosen branch if it does not exist yet
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Normalize the tag
        shell: pwsh
        run: |
          $tag = $env:TAG.Trim()
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          "TAG=$tag" >> $env:GITHUB_ENV
          $remote = "https://github.com/${{ github.repository }}"
          $found = git ls-remote --tags $remote "refs/tags/$tag"
          if ($found) {
              "REF=$tag" >> $env:GITHUB_ENV
          }
          else {
              "REF=${{ github.sha }}" >> $env:GITHUB_ENV
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Check the tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content installer\VERSION -Raw).Trim()
          if ("v$version" -ne $env:TAG) {
              throw "Tag $env:TAG does not match installer\VERSION ($version)."
          }

      - name: Build the app zip
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1

      - name: Attach the app zip to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $zip = "installer\Output\Mudspoon.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash

          gh release view $tag *> $null

          if ($LASTEXITCODE -ne 0) {
              gh release create $tag --target $env:REF --title $tag --notes "Mudspoon $tag"
          }

          gh release upload $tag $zip --clobber
          $notes = gh release view $tag --json body --jq .body
          $notes = ($notes.TrimEnd() + "`n`nSHA-256 of Mudspoon.zip: $hash").Trim()
          gh release edit $tag --notes $notes
