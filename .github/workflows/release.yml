name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, such as v0.1.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Normalize the tag
        shell: pwsh
        run: |
          $tag = $env:TAG.Trim()
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          "TAG=$tag" >> $env:GITHUB_ENV


      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content installer\VERSION -Raw).Trim()
          if ("v$version" -ne $env:TAG) {
              throw "Tag $env:TAG does not match installer\VERSION ($version)."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --no-progress -y
          }

      - name: Build the installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1

      - name: Attach the installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $setup = "installer\Output\Mudspoon-Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash

          gh release view $tag *> $null

          if ($LASTEXITCODE -ne 0) {
              gh release create $tag --title $tag --notes "Mudspoon $tag"
          }

          gh release upload $tag $setup --clobber
          $notes = gh release view $tag --json body --jq .body
          $notes = ($notes.TrimEnd() + "`n`nSHA-256 of Mudspoon-Setup.exe: $hash").Trim()
          gh release edit $tag --notes $notes
