name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content installer\VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              throw "Tag $env:GITHUB_REF_NAME does not match installer\VERSION ($version)."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --no-progress -y
          }

      - name: Build the installer
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1

      - name: Attach the installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $setup = "installer\Output\Mudspoon-Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          gh release upload $tag $setup --clobber
          $notes = gh release view $tag --json body --jq .body
          $notes = ($notes.TrimEnd() + "`n`nSHA-256 of Mudspoon-Setup.exe: $hash").Trim()
          gh release edit $tag --notes $notes
